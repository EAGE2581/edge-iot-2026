<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>EDGE-IOT · 故障诊断助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    margin: 0; padding: 0; height: 100vh;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column;
  }
  header {
    background: #1e293b; padding: 14px 20px;
    border-bottom: 1px solid #334155;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { margin: 0; font-size: 16px; color: #7dd3fc; }
  header .sub { color: #94a3b8; font-size: 12px; }
  #chat {
    flex: 1; overflow-y: auto;
    padding: 20px; display: flex; flex-direction: column; gap: 16px;
  }
  .msg { max-width: 820px; padding: 12px 16px; border-radius: 8px; line-height: 1.6; font-size: 14px; }
  .user { align-self: flex-end; background: #0c4a6e; color: #e0f2fe; }
  .ai   { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
  .ai .hits {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px dashed #334155;
    font-size: 12px; color: #94a3b8;
  }
  .ai .hits .tag {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    background: #334155; color: #cbd5e1; margin-right: 6px;
  }
  .ai .hits .tag.exact { background: #065f46; color: #d1fae5; }
  .ai h2 { color: #7dd3fc; font-size: 15px; margin: 14px 0 6px; }
  .ai h3 { color: #7dd3fc; font-size: 14px; margin: 12px 0 4px; }
  .ai p, .ai ul { margin: 6px 0; }
  .ai code { background: #0f172a; padding: 1px 5px; border-radius: 3px; color: #fbbf24; }
  .ai table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .ai th, .ai td { border: 1px solid #334155; padding: 4px 8px; }
  .loading { align-self: flex-start; color: #94a3b8; font-size: 13px; }
  .loading::after { content: " ●●●"; animation: blink 1.2s infinite; }
  @keyframes blink { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  footer { padding: 14px 20px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; }
  #q {
    flex: 1; padding: 10px 14px; border-radius: 6px;
    border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px;
  }
  #q:focus { outline: none; border-color: #7dd3fc; }
  #send {
    padding: 10px 22px; border-radius: 6px; border: none;
    background: #0ea5e9; color: white; font-size: 14px; cursor: pointer;
  }
  #send:disabled { background: #475569; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>EDGE-IOT 故障诊断助手</h1>
  <span class="sub">G120C 报警知识库 · 303 条</span>
</header>

<div id="chat">
  <div class="msg ai">你好，我是 G120C 变频器故障诊断助手。可以直接问报警代码或故障现象，比如：<code>8501怎么办</code>、<code>电机堵转</code>、<code>7900</code>。</div>
</div>

<footer>
  <input id="q" placeholder="输入问题，回车发送..." autocomplete="off">
  <button id="send">发送</button>
</footer>

<script>
const chat = document.getElementById('chat');
const qInput = document.getElementById('q');
const sendBtn = document.getElementById('send');

function addMsg(cls, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderHits(hits) {
  if (!hits || !hits.length) return '';
  const lines = hits.map(h => {
    const tagCls = h.source === '精确' ? 'tag exact' : 'tag';
    return `<div style="margin:2px 0;">
      <span class="${tagCls}">${h.source}</span>
      <code>${h.code}</code> ${escapeHtml(h.text)}
      <span style="color:#64748b;">（${h.similarity.toFixed(2)}）</span>
    </div>`;
  }).join('');
  return `<div class="hits"><b>检索命中：</b>${lines}</div>`;
}

async function ask() {
  const q = qInput.value.trim();
  if (!q) return;

  addMsg('user', escapeHtml(q));
  qInput.value = '';
  sendBtn.disabled = true;

  const loadingDiv = addMsg('loading', '思考中');

  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });

    if (!resp.ok) {
      const err = await resp.text();
      loadingDiv.className = 'msg ai';
      loadingDiv.innerHTML = `<span style="color:#fca5a5;">请求失败 (${resp.status})：${escapeHtml(err)}</span>`;
      return;
    }

    const data = await resp.json();
    loadingDiv.className = 'msg ai';
    const answerHtml = marked.parse(data.answer || '（无回答）');
    loadingDiv.innerHTML = answerHtml + renderHits(data.hits);
  } catch (e) {
    loadingDiv.className = 'msg ai';
    loadingDiv.innerHTML = `<span style="color:#fca5a5;">网络错误：${escapeHtml(e.message)}</span>`;
  } finally {
    chat.scrollTop = chat.scrollHeight;
    sendBtn.disabled = false;
    qInput.focus();
  }
}

sendBtn.onclick = ask;
qInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
qInput.focus();
</script>
</body>
</html>
